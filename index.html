<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>サービス終了</title>
  <style>
    /* 全画面・余白無し */
    html,body{
      height:100%;
      margin:0;
      background:#000; /* 背景色（黒） */
      -webkit-text-size-adjust:100%; /* iOSの自動拡大を抑制 */
    }

    /* 中央に大きく表示 */
    .center{
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:20px;
      box-sizing:border-box;
    }

    h1{
      margin:0;
      font-family: "ヒラギノ角ゴ ProN", "Hiragino Kaku Gothic ProN", "メイリオ", Meiryo, "Noto Sans JP", Arial, sans-serif;
      font-size:6.5vw; /* 画面幅に応じて自動縮尺（スマホ向け） */
      line-height:1;
      color:#fff; /* 文字色（白） */
      font-weight:700;
      letter-spacing:0.02em;
      /* 画面が極端に小さい時の最小サイズ */
      min-font-size:18px;
    }

    /* 小さい画面での微調整（任意） */
    @media (max-width:360px){
      h1{ font-size:22px; }
    }
  </style>
</head>
<body>
  <div class="center" role="status" aria-live="polite">
    <h1>サービス終了</h1>
  </div>
</body>
</html>
